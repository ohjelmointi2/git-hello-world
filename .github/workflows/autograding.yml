name: Autograding workflow

on:
  - push
  - workflow_dispatch

permissions:
  contents: read
  statuses: write

jobs:
  build:
    name: Autograding
    runs-on: ubuntu-latest
    if: (github.event_name != 'push' || github.event.head_commit.message != 'Initial commit')

    steps:
      - uses: actions/checkout@v7

      # Run tests and generate grading report
      - name: Autograding
        uses: ohjelmointi2/grading-action@v0
        timeout-minutes: 2
        with:
          test_suite: .grading/config.json

